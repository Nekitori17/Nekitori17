name: Update WakaTime Stats SVG

on:
  schedule:
    - cron: "1 0 */14 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate SVG from Vercel API
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wakatime
          curl -fsSL "https://wakatime-readme-stats.vercel.app/api/wakatimeStats?components=5&component1_type=basic&component1_hide_github_contributions=false&component1_hide_github_commits=false&component1_hide_github_prs=false&component1_hide_github_issues=false&component1_hide_github_reviews=false&component1_hide_github_stars=false&component1_hide_github_followers=false&component2_type=weekly&component3_type=weekly_langs&component4_type=all_langs&component5_type=all_projs&username=Plinkatsu&theme=warm_graphite&show_header=true&show_logo=true&api_key=$WAKATIME_API_KEY&github_token=$GITHUB_TOKEN" \
            -o wakatime/stats.svg

      - name: Bump README cache-buster for wakatime/stats.svg (daily)
        run: |
          set -euo pipefail

          V="$(date -u +%Y%m%d)"  # changes once per day

          sed -i -E "s#(wakatime/stats\.svg)\?v=[0-9]+#\1?v=$V#g" README.md
          sed -i -E "s#(wakatime/stats\.svg)(\"|')#\1?v=$V\2#g" README.md

      - name: Commit changes to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add wakatime/stats.svg README.md
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore(): Update WakaTime stats SVG (cache-bust v=$(date -u +%Y%m%d))"
          git push